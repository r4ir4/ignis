server {
    listen 80;
    server_name ignis.farm www.ignis.farm;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache" always;
    # Native notebook and trackers; existing Ignis forward-auth protects this server.
    location ~ ^/api/(?:notebook|habits|meds)(?:/|$) {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $notebook_api http://ignis-notebook-production-api:8000;
        proxy_pass $notebook_api;
        proxy_connect_timeout 3s;
        proxy_read_timeout 25s;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Remote-Email "";
        proxy_set_header Remote-User "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        client_max_body_size 20m;
    }
    location /api/ { return 404; }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
