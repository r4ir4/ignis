  <main class="wrap">
    <section class="intro">
      <h1>Your scans</h1>
      <p>Text read by the Ignis app on your iPhone and iPad shows up here.</p>
    </section>

    <div class="searchrow">
      <input id="q" type="search" placeholder="Search your scans…" aria-label="Search scans" autocomplete="off">
      <span id="count" class="count" aria-live="polite"></span>
    </div>

    <p id="status" class="status" role="status" hidden></p>
    <ul id="list" class="list"></ul>
    <p id="empty" class="empty" hidden></p>
    <div class="morewrap"><button id="more" class="ghost" type="button" hidden>Load more</button></div>
  </main>

  <dialog id="dlg" class="modal" aria-labelledby="dlgTitle">
    <form id="form" method="dialog" autocomplete="off">
      <h2 id="dlgTitle">New scan</h2>
      <p class="hint">Type or paste text to save it with your other scans.</p>
      <textarea id="text" rows="8" maxlength="100000" placeholder="Text to save…" aria-label="Scan text"></textarea>
      <p id="formErr" class="err" role="alert" hidden></p>
      <div class="actions">
        <span class="tip">Ctrl/⌘ + Enter to save</span>
        <button type="button" class="ghost" id="cancel">Cancel</button>
        <button type="submit" class="solid" id="save">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="app.js?v=1"></script>
  <script src="flame.js?v=1"></script>
