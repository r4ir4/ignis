<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4e4d0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="home.css?v=113">
  <link rel="stylesheet" href="style.css?v=5">
  <link rel="stylesheet" href="flame.css?v=3">
  <title>Scans · Ignis</title>
  <link rel="stylesheet" href="home-minimal.css?v=2">
  <link rel="stylesheet" href="nav-menu.css?v=2">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=DM+Mono:wght@400;500&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sand-trial.css">
  <link rel="stylesheet" href="mobile.css?v=1">
</head>
<body class="home">
  <script src="shell.js?v=2"></script>

  <main id="main" class="wrap">
    <section class="intro">
      <h1>Your scans</h1>
      <p>Text read by the Ignis app on your iPhone and iPad shows up here.</p>
      <button id="newBtn" class="solid" type="button">+ New scan</button>
    </section>

    <div class="searchrow">
      <input id="q" type="search" placeholder="Search your scans…" aria-label="Search scans" autocomplete="off">
      <span id="count" class="count" aria-live="polite"></span>
    </div>

    <p id="status" class="status" role="status" hidden></p>
    <ul id="list" class="list"></ul>
    <p id="empty" class="empty" hidden></p>
    <div class="morewrap"><button id="more" class="ghost" type="button" hidden>Load more</button></div>
  </main>

  <dialog id="dlg" class="modal" aria-labelledby="dlgTitle">
    <form id="form" method="dialog" autocomplete="off">
      <h2 id="dlgTitle">New scan</h2>
      <p class="hint">Type or paste text to save it with your other scans.</p>
      <textarea id="text" rows="8" maxlength="100000" placeholder="Text to save…" aria-label="Scan text"></textarea>
      <p id="formErr" class="err" role="alert" hidden></p>
      <div class="actions">
        <span class="tip">Ctrl/⌘ + Enter to save</span>
        <button type="button" class="ghost" id="cancel">Cancel</button>
        <button type="submit" class="solid" id="save">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="app.js?v=1"></script>
  <script src="flame.js?v=1"></script>
  <script src="dialogs.js?v=1"></script>
  <script src="nav-menu.js?v=1"></script>
  <script src="sparkle.js?v=4"></script>
</body>
</html>
