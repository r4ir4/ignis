<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4e4d0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="home.css?v=113">
  <link rel="stylesheet" href="flame.css?v=3">
  <link rel="stylesheet" href="health.css?v=39">
  <link rel="stylesheet" href="metrics.css?v=2">
  <title>Metrics · Ignis</title>
  <link rel="stylesheet" href="home-minimal.css?v=2">
  <link rel="stylesheet" href="nav-menu.css?v=2">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=DM+Mono:wght@400;500&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sand-trial.css">
  <link rel="stylesheet" href="mobile.css?v=1">
</head>
<body class="home health metrics">
  <script src="shell.js?v=2"></script>


  <main id="main" class="page h-page">
    <p class="h-empty" id="mtEmpty" hidden></p>
    <div id="mtGrid"></div>
  </main>

  <dialog class="mt-modal mt-wide" id="mtLogDialog" aria-labelledby="mtLogTitle">
    <form method="dialog" id="mtLogForm" novalidate>
      <header><h2 id="mtLogTitle">Registrar medidas</h2><button type="button" class="mt-x" id="mtLogClose" aria-label="Fechar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
      <div class="mt-dcard">
        <span class="mt-label">Dia</span>
        <div class="mt-dayrow">
          <div class="mt-seg" id="mtQuick" role="group" aria-label="Dia rápido"><button type="button" data-v="0">Hoje</button><button type="button" data-v="1">Ontem</button></div>
          <input type="hidden" id="mtDay">
          <button type="button" class="mt-daybtn" id="mtDayBtn" aria-expanded="false" aria-controls="mtCal"><span id="mtDayText"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
        </div>
        <div class="mt-cal" id="mtCal" hidden>
          <header><button type="button" class="mt-calnav" id="mtCalPrev" aria-label="Mês anterior">&#8249;</button><h3 id="mtCalTitle"></h3><button type="button" class="mt-calnav" id="mtCalNext" aria-label="Próximo mês">&#8250;</button></header>
          <div class="mt-dow" aria-hidden="true"><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span><span>D</span></div>
          <div class="mt-days" id="mtCalGrid"></div>
        </div>
        <p class="mt-hint">Preencha só o que você mediu. O que ficar vazio é ignorado, e limpar um campo preenchido remove a medida.</p>
        <div class="mt-fields" id="mtFields"></div>
      </div>
      <p class="mt-err" id="mtLogErr" role="alert" hidden></p>
      <button class="mt-save" type="submit" id="mtLogSave"><span>Salvar medidas</span></button>
      <button class="mt-del" type="button" id="mtLogDelete" hidden>Apagar este dia</button>
    </form>
  </dialog>

  <dialog class="mt-modal" id="mtGoalDialog" aria-labelledby="mtGoalTitle">
    <form method="dialog" id="mtGoalForm" novalidate>
      <header><h2 id="mtGoalTitle">Meta</h2><button type="button" class="mt-x" id="mtGoalClose" aria-label="Fechar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
      <div class="mt-dcard">
        <label class="mt-label" for="mtGoalVal" id="mtGoalLabel">Alvo</label>
        <input class="mt-input mt-big" id="mtGoalVal" type="number" inputmode="decimal" step="0.1" min="0" placeholder="0">
        <p class="mt-hint">Deixe vazio e salve para remover a meta.</p>
      </div>
      <p class="mt-err" id="mtGoalErr" role="alert" hidden></p>
      <button class="mt-save" type="submit" id="mtGoalSave"><span>Salvar meta</span></button>
    </form>
  </dialog>

  <div class="h-toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="confirm.js?v=1"></script>
  <script src="metrics.js?v=5"></script>
  <script src="flame.js?v=1"></script>
  <script src="dialogs.js?v=1"></script>
  <script src="nav-menu.js?v=1"></script>
  <script src="sparkle.js?v=4"></script>
</body>
</html>
