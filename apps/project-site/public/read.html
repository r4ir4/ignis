<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4e4d0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="home.css?v=113">
  <link rel="stylesheet" href="flame.css?v=3">
  <link rel="stylesheet" href="health.css?v=39">
  <link rel="stylesheet" href="food.css?v=48">
  <link rel="stylesheet" href="read.css?v=18">
  <title>Read · Ignis</title>
  <link rel="stylesheet" href="home-minimal.css?v=2">
  <link rel="stylesheet" href="nav-menu.css?v=2">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=DM+Mono:wght@400;500&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sand-trial.css">
  <link rel="stylesheet" href="mobile.css?v=1">
</head>
<body class="home health food read">
  <script src="shell.js?v=2"></script>


  <main id="main" class="page h-page">
    <p class="h-empty" id="rdEmpty" hidden></p>
    <div id="rdGrid"></div>
  </main>

  <dialog class="fd-modal rd-dlg" id="rdBookDialog" aria-labelledby="rdBookTitle">
    <form method="dialog" id="rdBookForm" novalidate>
      <header><h2 id="rdBookTitle">Add book</h2><button type="button" class="fd-x" id="rdBookClose" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
      <div class="fd-dcard">
        <div class="rd-coverfield">
          <span class="rd-cover" id="rdCoverPreview" aria-hidden="true"></span>
          <div class="rd-coverside">
            <span class="fd-label">Cover <em>(optional)</em></span>
            <div class="rd-coverbtns">
              <button type="button" class="rd-cbtn" id="rdCoverPick">Upload cover</button>
              <button type="button" class="rd-cbtn rd-cdel" id="rdCoverRemove" hidden>Remove</button>
            </div>
            <input type="file" id="rdCoverFile" accept="image/*" hidden>
          </div>
        </div>
        <label class="fd-label" for="rdTitle">Title</label>
        <input class="fd-input" id="rdTitle" maxlength="200" autocomplete="off" placeholder="The book's title…">
        <label class="fd-label" for="rdAuthor">Author <em>(optional)</em></label>
        <input class="fd-input" id="rdAuthor" maxlength="120" autocomplete="off" placeholder="Who wrote it…">
        <div class="rd-two">
          <div><label class="fd-label" for="rdStatus">Shelf</label>
            <select class="fd-input fd-divsel" id="rdStatus"><option value="reading">Reading</option><option value="to_read">To read</option><option value="finished">Finished</option><option value="dropped">Dropped</option></select></div>
          <div><label class="fd-label" for="rdPages">Pages</label><input class="fd-input" id="rdPages" type="number" inputmode="numeric" min="1" max="20000" placeholder="0"></div>
        </div>
        <div id="rdNowWrap"><label class="fd-label" for="rdNow">On page</label><input class="fd-input" id="rdNow" type="number" inputmode="numeric" min="0" max="20000" placeholder="0"></div>
        <span class="fd-label">Rating <em>(optional)</em></span>
        <div class="rd-stars" id="rdStars" role="group" aria-label="Rating"></div>
        <label class="fd-label" for="rdNotes">Notes <em>(optional)</em></label>
        <input class="fd-input" id="rdNotes" maxlength="1000" autocomplete="off" placeholder="Why you picked it, what stuck with you…">
      </div>
      <p class="fd-err" id="rdBookErr" role="alert" hidden></p>
      <button class="fd-save" type="submit" id="rdBookSave"><span>Save book</span></button>
      <button class="fd-del" type="button" id="rdBookDelete" hidden>Delete this book</button>
    </form>
  </dialog>

  <dialog class="fd-modal rd-dlg" id="rdLogDialog" aria-labelledby="rdLogTitle">
    <form method="dialog" id="rdLogForm" novalidate>
      <header><h2 id="rdLogTitle">Log pages</h2><button type="button" class="fd-x" id="rdLogClose" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
      <div class="fd-dcard">
        <p class="rd-logbook" id="rdLogBook"></p>
        <label class="fd-calbox" for="rdLogPages"><span class="fd-label">Pages read</span><span class="fd-calrow"><input class="fd-input fd-big" id="rdLogPages" type="number" inputmode="numeric" min="1" max="5000" placeholder="0"><small>pages</small></span></label>
        <div class="rd-chips" id="rdLogChips" role="group" aria-label="Quick amounts"><button type="button" data-n="5">+5</button><button type="button" data-n="10">+10</button><button type="button" data-n="20">+20</button><button type="button" data-n="50">+50</button></div>
        <span class="fd-label">Day</span>
        <div class="rd-days" id="rdLogDay" role="group" aria-label="Day"><button type="button" data-v="0">Today</button><button type="button" data-v="1">Yesterday</button></div>
      </div>
      <p class="fd-err" id="rdLogErr" role="alert" hidden></p>
      <button class="fd-save" type="submit" id="rdLogSave"><span>Add to my reading</span></button>
    </form>
  </dialog>

  <div class="h-toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="read.js?v=17"></script>
  <script src="flame.js?v=1"></script>
  <script src="dialogs.js?v=1"></script>
  <script src="nav-menu.js?v=1"></script>
  <script src="sparkle.js?v=4"></script>
</body>
</html>
