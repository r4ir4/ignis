<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4e4d0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="home.css?v=113">
  <link rel="stylesheet" href="flame.css?v=3">
  <link rel="stylesheet" href="health.css?v=39">
  <link rel="stylesheet" href="toast.css?v=1">
  <title>Notes · Ignis</title>
  <link rel="stylesheet" href="home-minimal.css?v=2">
  <link rel="stylesheet" href="nav-menu.css?v=2">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=DM+Mono:wght@400;500&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sand-trial.css">
  <link rel="stylesheet" href="notes.css?v=9">
  <link rel="stylesheet" href="mobile.css?v=1">
</head>
<body class="home health notes">
  <script src="shell.js?v=2"></script>

  <main id="main" class="page nt-page">
    <header class="nt-head" id="ntHead">
      <div><h1>Notes</h1><p id="ntSub">Carregando…</p></div>
      <div class="nt-hright">
        <label class="nt-search" id="ntSearchWrap"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input id="ntSearch" type="search" placeholder="Buscar" autocomplete="off" aria-label="Buscar notas"></label>
        <button class="nt-new" id="ntNew" type="button"><span aria-hidden="true">+</span>Nova nota</button>
      </div>
    </header>
    <p class="nt-empty" id="ntEmpty" hidden></p>
    <ul class="nt-cards" id="ntCards" aria-label="Suas notas"></ul>

    <article class="nt-doc" id="ntDoc" hidden>
      <div class="nt-bar">
        <button class="nt-back" id="ntBack" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Todas as notas</button>
        <span class="nt-status" id="ntStatus" aria-live="polite"></span>
        <button class="nt-ib" id="ntPrint" type="button" title="Imprimir" aria-label="Imprimir"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V4h10v5M7 17H5a1.500 1.500 0 0 1-1.500-1.500v-5A1.500 1.500 0 0 1 5 9h14a1.500 1.500 0 0 1 1.500 1.500v5A1.500 1.500 0 0 1 19 17h-2"/><path d="M7 14h10v6H7Z"/></svg></button>
        <button class="nt-ib" id="ntEdit" type="button" aria-pressed="false" title="Editar" aria-label="Editar"><svg class="i-edit" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16Z"/><path d="M13.500 6.500l4 4"/></svg><svg class="i-done" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.500l4.500 4.500L19 7.500"/></svg></button>
        <button class="nt-ib danger" id="ntDel" type="button" title="Apagar nota" aria-label="Apagar nota"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.500 7h15M9.500 7V4.500h5V7M6.500 7l.8 12.500h9.400L17.500 7M10 11v5M14 11v5"/></svg></button>
      </div>
      <input class="nt-title" id="ntTitle" maxlength="200" autocomplete="off" placeholder="Sem título" aria-label="Título da nota">
      <p class="nt-meta" id="ntMeta"></p>
      <div class="nt-editor" id="ntEditor"></div>
    </article>
  </main>

  <div class="nt-paper nt-printroot" id="ntPrintRoot" aria-hidden="true"></div>

  <div class="nt-bubble" id="ntBubble" hidden></div>
  <div class="nt-slash" id="ntSlash" role="listbox" hidden></div>
  <div class="h-toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="vendor/tiptap/tiptap.js?v=1"></script>
  <script src="toast.js?v=2"></script>
  <script src="confirm.js?v=1"></script>
  <script src="notes.js?v=9"></script>
  <script src="flame.js?v=1"></script>
  <script src="dialogs.js?v=1"></script>
  <script src="nav-menu.js?v=1"></script>
  <script src="sparkle.js?v=5"></script>
</body>
</html>
