  <main id="main" class="page h-page">
    <p class="h-empty" id="fdEmpty" hidden></p>

  </main>

  <dialog class="fd-modal fd-wide" id="fdMealDialog" aria-labelledby="fdMealTitle">
    <form method="dialog" id="fdMealForm" novalidate>
      <header><h2 id="fdMealTitle">Add meal</h2><button type="button" class="fd-x" id="fdMealClose" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
      <div class="fd-cols">
        <div class="fd-colL">
          <div class="fd-dcard">
            <span class="fd-label">Meal</span>
            <div class="fd-seg" id="fdSlots" role="group" aria-label="Meal"><button type="button" data-v="breakfast">Café da manhã</button><button type="button" data-v="am_snack">Lanche da manhã</button><button type="button" data-v="lunch">Almoço</button><button type="button" data-v="pm_snack">Lanche da tarde</button><button type="button" data-v="dinner">Jantar</button><button type="button" data-v="supper">Ceia</button></div>
            <label class="fd-label" for="fdName">What did you eat</label>
            <input class="fd-input" id="fdName" maxlength="120" autocomplete="off" placeholder="Oatmeal with banana…">
            <label class="fd-label" for="fdCal">Calories</label>
            <input class="fd-input fd-big" id="fdCal" type="number" inputmode="numeric" min="0" max="20000" placeholder="0">
            <div class="fd-macros">
              <div><label class="fd-label" for="fdP">Protein g</label><input class="fd-input" id="fdP" type="number" inputmode="decimal" min="0" max="2000" placeholder="0"></div>
              <div><label class="fd-label" for="fdC">Carbs g</label><input class="fd-input" id="fdC" type="number" inputmode="decimal" min="0" max="2000" placeholder="0"></div>
              <div><label class="fd-label" for="fdF">Fat g</label><input class="fd-input" id="fdF" type="number" inputmode="decimal" min="0" max="2000" placeholder="0"></div>
              <div><label class="fd-label" for="fdFi">Fiber g</label><input class="fd-input" id="fdFi" type="number" inputmode="decimal" min="0" max="500" placeholder="0"></div>
            </div>
          </div>
          <label class="fd-label fd-l2" for="fdNotes">Notes <em>(optional)</em></label>
          <input class="fd-input fd-in2" id="fdNotes" maxlength="500" autocomplete="off" placeholder="Where, with whom, how it was…">
          <span class="fd-label fd-l2">How did it feel <em>(optional)</em></span>
          <div class="fd-feel" id="fdFeel" role="group" aria-label="How it felt"><button type="button" data-v="great" class="f1">Great</button><button type="button" data-v="ok" class="f2">Okay</button><button type="button" data-v="heavy" class="f3">Heavy</button></div>
          <button type="button" class="fd-keep" id="fdKeep" aria-pressed="false"><span class="fd-keepbox" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.5 6.6 19.5l1.2-6L3.3 9.3l6.1-.7Z"/></svg></span><span>Save to my foods</span></button>
        </div>
        <aside class="fd-colR" aria-label="Foods to pick from">
          <div class="fd-lib">
            <div class="fd-libhead"><span class="fd-label">Pick a food</span></div>
            <div class="fd-seg fd-seg2" id="fdLibTabs" role="group" aria-label="Food list"><button type="button" data-v="saved" aria-pressed="true">My foods</button><button type="button" data-v="recent" aria-pressed="false">Recent</button></div>
            <input class="fd-input fd-search" id="fdLibSearch" type="search" autocomplete="off" placeholder="Search…" aria-label="Search foods">
            <ul class="fd-libs" id="fdLibList"></ul>
          </div>
        </aside>
      </div>
      <p class="fd-err" id="fdMealErr" role="alert" hidden></p>
      <button class="fd-save" type="submit" id="fdMealSave"><span>Save meal</span></button>
      <button class="fd-del" type="button" id="fdMealDelete" hidden>Delete this meal</button>
    </form>
  </dialog>

  <dialog class="fd-modal" id="fdFoodDialog" aria-labelledby="fdFoodTitle">
    <form method="dialog" id="fdFoodForm" novalidate>
      <header><h2 id="fdFoodTitle">Create food</h2><button type="button" class="fd-x" id="fdFoodClose" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
      <div class="fd-dcard">
        <span class="fd-label">Usually eaten at <em>(optional)</em></span>
        <div class="fd-seg" id="fdFoodSlots" role="group" aria-label="Usual meal"><button type="button" data-v="breakfast">Café da manhã</button><button type="button" data-v="am_snack">Lanche da manhã</button><button type="button" data-v="lunch">Almoço</button><button type="button" data-v="pm_snack">Lanche da tarde</button><button type="button" data-v="dinner">Jantar</button><button type="button" data-v="supper">Ceia</button></div>
        <label class="fd-label" for="fdFoodName">Name</label>
        <input class="fd-input" id="fdFoodName" maxlength="120" autocomplete="off" placeholder="Oatmeal with banana…">
        <label class="fd-label" for="fdFoodCal">Calories</label>
        <input class="fd-input fd-big" id="fdFoodCal" type="number" inputmode="numeric" min="0" max="20000" placeholder="0">
        <div class="fd-macros">
          <div><label class="fd-label" for="fdFoodP">Protein g</label><input class="fd-input" id="fdFoodP" type="number" inputmode="decimal" min="0" max="2000" placeholder="0"></div>
          <div><label class="fd-label" for="fdFoodC">Carbs g</label><input class="fd-input" id="fdFoodC" type="number" inputmode="decimal" min="0" max="2000" placeholder="0"></div>
          <div><label class="fd-label" for="fdFoodF">Fat g</label><input class="fd-input" id="fdFoodF" type="number" inputmode="decimal" min="0" max="2000" placeholder="0"></div>
          <div><label class="fd-label" for="fdFoodFi">Fiber g</label><input class="fd-input" id="fdFoodFi" type="number" inputmode="decimal" min="0" max="500" placeholder="0"></div>
        </div>
      </div>
      <p class="fd-err" id="fdFoodErr" role="alert" hidden></p>
      <button class="fd-save" type="submit" id="fdFoodSave"><span>Save to my foods</span></button>
    </form>
  </dialog>

  <dialog class="fd-modal" id="fdGoalDialog" aria-labelledby="fdGoalTitle">
    <form method="dialog" id="fdGoalForm" novalidate>
      <header><h2 id="fdGoalTitle">Daily goals</h2><button type="button" class="fd-x" id="fdGoalClose" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
      <div class="fd-dcard">
        <label class="fd-label" for="fdGCal">Calories a day</label>
        <input class="fd-input fd-big" id="fdGCal" type="number" inputmode="numeric" min="0" max="20000" placeholder="2000">
        <div class="fd-macros">
          <div><label class="fd-label" for="fdGP">Protein g</label><input class="fd-input" id="fdGP" type="number" inputmode="decimal" min="0" max="2000" placeholder="0"></div>
          <div><label class="fd-label" for="fdGC">Carbs g</label><input class="fd-input" id="fdGC" type="number" inputmode="decimal" min="0" max="2000" placeholder="0"></div>
          <div><label class="fd-label" for="fdGF">Fat g</label><input class="fd-input" id="fdGF" type="number" inputmode="decimal" min="0" max="2000" placeholder="0"></div>
          <div><label class="fd-label" for="fdGFi">Fiber g</label><input class="fd-input" id="fdGFi" type="number" inputmode="decimal" min="0" max="500" placeholder="0"></div>
        </div>
      </div>
      <p class="fd-err" id="fdGoalErr" role="alert" hidden></p>
      <button class="fd-save" type="submit" id="fdGoalSave"><span>Save goals</span></button>
    </form>
  </dialog>

  <div class="h-toast" id="toast" role="status" aria-live="polite" hidden></div>
