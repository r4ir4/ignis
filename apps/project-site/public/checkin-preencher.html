<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4e4d0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="home.css?v=113">
  <link rel="stylesheet" href="flame.css?v=3">
  <link rel="stylesheet" href="health.css?v=39">
  <link rel="stylesheet" href="checkin.css?v=10">
  <title>Formulário · Ignis</title>
  <link rel="stylesheet" href="checkin-form.css?v=31">
  <link rel="stylesheet" href="home-minimal.css?v=2">
  <link rel="stylesheet" href="nav-menu.css?v=2">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=DM+Mono:wght@400;500&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sand-trial.css">
  <link rel="stylesheet" href="checkin-venvanse.css?v=3">
  <link rel="stylesheet" href="checkin-custom.css?v=3">
  <link rel="stylesheet" href="mobile.css?v=1">
</head>
<body class="home health checkin">
  <script src="shell.js?v=2"></script>

  <main id="main" class="page ck-page cf-page">
    <div class="ck-topbar">
      <a class="ck-backlink" id="cfBack" href="checkin"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg> Voltar</a>
      <div class="ck-topicons">
        <a class="ck-topicon" id="cfEditLink" href="#" aria-label="Editar formulário" title="Editar formulário"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4zM13.500 6.500l4 4"/></svg></a>
        <button type="button" class="ck-topicon ck-topicon-danger" id="cfDel" aria-label="Remover formulário" title="Remover formulário"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button>
      </div>
    </div>
    <header class="ck-hero"><h1 id="cfTitle">Formulário</h1></header>

    <div class="cf-form" id="cfForm">
      <section class="cf-card cf-day" id="cfDay" style="--i:0">
        <h2><b id="cfDate"></b></h2>
        <p class="cf-lead" id="cfLead"></p>
        <div class="cf-log" id="cfLog" aria-live="polite"><p class="cf-empty">Carregando...</p></div>
      </section>

      <div class="cf-startrow" id="cfStart" style="--i:2" hidden><button type="button" class="cf-save cf-go" id="cfGo">Começar</button></div>
      <p class="cf-records" id="cfRecords"><a id="cfRecordsLink" href="#">Ver registros e gráficos →</a></p>

      <section class="cf-card cf-stage" id="cfStage" aria-live="polite" hidden></section>
      <section class="cf-card cf-done" id="cfDone" aria-live="polite" hidden></section>
    </div>
  </main>

  <script src="flame.js?v=1"></script>
  <script src="dialogs.js?v=1"></script>
  <script src="nav-menu.js?v=1"></script>
  <script src="checkin-lib.js?v=2"></script>
  <script src="checkin-preencher.js?v=1"></script>
</body>
</html>
