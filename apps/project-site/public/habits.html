<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4e4d0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="home.css?v=113">
  <link rel="stylesheet" href="flame.css?v=3">
  <link rel="stylesheet" href="health.css?v=39">
  <link rel="stylesheet" href="habits.css?v=48">
  <title>Hábitos · Ignis</title>
  <link rel="stylesheet" href="home-minimal.css?v=2">
  <link rel="stylesheet" href="nav-menu.css?v=2">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=DM+Mono:wght@400;500&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sand-trial.css">
  <link rel="stylesheet" href="mobile.css?v=1">
</head>
<body class="home health habits">
  <script src="shell.js?v=2"></script>


  <main id="main" class="page h-page" lang="pt-BR">

    <p class="h-empty" id="habEmpty" hidden></p>
    <div class="hab-grid" id="habGrid"></div>
  </main>

  <dialog class="hab-modal" id="habDialog" aria-labelledby="habDlgTitle" lang="pt-BR">
    <form method="dialog" id="habForm" novalidate>
      <header><h2 id="habDlgTitle">Novo hábito</h2><button type="button" class="hab-x" id="habClose" aria-label="Fechar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
      <div class="hab-dcard">
        <span class="hab-label">Tipo</span>
        <div class="hab-types" id="habTypes" role="group" aria-label="Tipo de hábito">
          <button type="button" data-k="check" aria-pressed="true">Check-in</button><button type="button" data-k="time" aria-pressed="false">Tempo</button>
        </div>
        <label class="hab-label" for="habName">Nome</label>
        <input class="hab-input" id="habName" maxlength="80" autocomplete="off" placeholder="Escovar os dentes, ler, beber água…">
        <span class="hab-label" id="habTargetLabel">Vezes por dia</span>
        <div class="hab-step" id="habStep"><button type="button" aria-label="Menos" data-d="-1">&minus;</button><div class="hab-tnum"><b id="habTarget">1</b><span class="hab-note" id="habNote"></span><span class="hab-tdots" id="habDots" aria-hidden="true"></span></div><button type="button" aria-label="Mais" data-d="1">+</button></div>
        <div id="habUnitRow" hidden><label class="hab-label" for="habUnit">Unidade <em>(opcional)</em></label><input class="hab-input" id="habUnit" maxlength="20" autocomplete="off" placeholder="copos, páginas, xícaras…"></div>
      </div>
      <label class="hab-label hab-l2" for="habSection">Grupo <em>(opcional)</em></label>
      <select class="hab-input hab-in2" id="habSection"></select>
      <p class="hab-err" id="habErr" role="alert" hidden></p>
      <button class="hab-save" type="submit" id="habSave"><span>Salvar hábito</span></button>
      <button class="hab-del" type="button" id="habDelete" hidden>Apagar este hábito</button>
    </form>
  </dialog>

  <dialog class="bp-modal bp-small hab-cm" id="habCatDialog" aria-labelledby="habCatTitle" lang="pt-BR">
    <form method="dialog" id="habCatForm" novalidate>
      <header><div><h2 id="habCatTitle">Grupos</h2><p class="hab-cm-sub">Arraste para mudar a ordem. Clique no nome para renomear.</p></div><button type="button" class="bp-x" id="habCatClose" aria-label="Fechar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
      <div class="hab-cm-add"><input class="bp-input" id="habCatNew" maxlength="40" autocomplete="off" placeholder="Nome do novo grupo" aria-label="Nome do novo grupo"><button type="submit" class="hab-cm-go" aria-label="Adicionar grupo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Adicionar</button></div>
      <p class="bp-err" id="habCatErr" role="alert" hidden></p>
      <ul class="hab-cm-rows" id="habCatRows"></ul>
    </form>
  </dialog>

  <dialog class="hab-modal hab-confirm" id="habDelDialog" aria-labelledby="habDelTitle" lang="pt-BR">
    <form method="dialog" novalidate>
      <header><h2 id="habDelTitle">Apagar hábito</h2><button type="button" class="hab-x" id="habDelClose" aria-label="Fechar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
      <p class="hab-deltext" id="habDelText"></p>
      <div class="hab-delacts"><button type="button" class="hab-delcancel" id="habDelCancel">Cancelar</button><button type="button" class="hab-delgo" id="habDelGo">Apagar</button></div>
    </form>
  </dialog>

  <div class="h-toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="confirm.js?v=1"></script>
  <script src="habits.js?v=42"></script>
  <script src="flame.js?v=1"></script>
  <script src="dialogs.js?v=1"></script>
  <script src="nav-menu.js?v=1"></script>
  <script src="sparkle.js?v=4"></script>
</body>
</html>
