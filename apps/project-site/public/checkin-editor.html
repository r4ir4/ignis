<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4e4d0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="home.css?v=113">
  <link rel="stylesheet" href="flame.css?v=3">
  <link rel="stylesheet" href="health.css?v=39">
  <link rel="stylesheet" href="checkin.css?v=10">
  <title>Formulário · Ignis</title>
  <link rel="stylesheet" href="checkin-form.css?v=31">
  <link rel="stylesheet" href="home-minimal.css?v=2">
  <link rel="stylesheet" href="nav-menu.css?v=2">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=DM+Mono:wght@400;500&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sand-trial.css">
  <link rel="stylesheet" href="checkin-venvanse.css?v=3">
  <link rel="stylesheet" href="checkin-custom.css?v=1">
  <link rel="stylesheet" href="mobile.css?v=1">
</head>
<body class="home health checkin">
  <script src="shell.js?v=2"></script>

  <main id="main" class="page ck-page ed-page">
    <a class="ck-backlink" id="edBack" href="checkin"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg> Voltar</a>
    <header class="ck-hero"><h1 id="edTitle">Novo formulário</h1></header>

    <section class="ed-card">
      <label class="ed-field"><span>Nome do formulário</span><input id="edName" type="text" maxlength="60" placeholder="Ex.: Foco de estudo"></label>
      <label class="ed-field"><span>Descrição (opcional)</span><input id="edDesc" type="text" maxlength="300" placeholder="Uma frase sobre para que serve"></label>
    </section>

    <h2 class="ed-h">Perguntas</h2>
    <ol class="ed-list" id="edList"></ol>
    <p class="ed-empty" id="edEmpty" hidden>Nenhuma pergunta ainda.</p>
    <button type="button" class="ed-add" id="edAdd">+ Adicionar pergunta</button>

    <p class="ed-err" id="edErr" role="alert" hidden></p>
    <div class="ed-actions">
      <button type="button" class="ed-save" id="edSave">Salvar formulário</button>
      <button type="button" class="ed-archive" id="edArchive" hidden>Arquivar formulário</button>
    </div>
  </main>

  <script src="flame.js?v=1"></script>
  <script src="dialogs.js?v=1"></script>
  <script src="nav-menu.js?v=1"></script>
  <script src="checkin-lib.js?v=2"></script>
  <script src="checkin-editor.js?v=1"></script>
</body>
</html>
