<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4e4d0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="home.css?v=113">
  <link rel="stylesheet" href="flame.css?v=3">
  <link rel="stylesheet" href="health.css?v=39">
  <link rel="stylesheet" href="subscriptions.css?v=10">
  <link rel="stylesheet" href="subscriptions-page.css?v=8">
  <link rel="stylesheet" href="checkin.css?v=10">
  <link rel="stylesheet" href="wishlist-page.css?v=5">
  <link rel="stylesheet" href="toast.css?v=1">
  <title>Wishlist · Ignis</title>
  <link rel="stylesheet" href="home-minimal.css?v=2">
  <link rel="stylesheet" href="nav-menu.css?v=2">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=DM+Mono:wght@400;500&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sand-trial.css">
  <link rel="stylesheet" href="mobile.css?v=1">
</head>
<body class="sb-theme home health wishlist">
  <script src="shell.js?v=2"></script>


  <main id="main" class="page h-page">
    <p class="h-empty" id="wlEmpty" hidden></p>
    <div id="wlGrid"></div>
  </main>

  <dialog class="bd-modal" id="wlCatDialog" aria-labelledby="wlCatTitle">
    <form method="dialog" id="wlCatForm" novalidate>
      <header><h2 id="wlCatTitle">Categorias</h2><button type="button" class="bd-x" id="wlCatClose" aria-label="Fechar"></button></header>
      <ul class="wl-catrows" id="wlCatRows"></ul>
      <div class="wl-catadd"><input class="bd-input" id="wlCatNew" maxlength="40" autocomplete="off" placeholder="Nova categoria" aria-label="Nome da nova categoria"><button type="submit" class="sb-mbtn">Adicionar</button></div>
      <p class="bd-err" id="wlCatErr" role="alert" hidden></p>
    </form>
  </dialog>

  <dialog class="bd-modal" id="wlDialog" aria-labelledby="wlDlgTitle">
    <form method="dialog" id="wlForm" novalidate>
      <header><h2 id="wlDlgTitle">Adicionar à lista de desejos</h2><button type="button" class="bd-x" id="wlClose" aria-label="Fechar"></button></header>
      <div class="sb-card wl-dform">
        <div class="wl-dleft">
          <span class="bd-label">Imagens</span>
          <div class="wl-pic">
            <div class="wl-thumbs" id="wlThumbs"></div>
            <p class="wl-picnone" id="wlPicNone">Sem imagem</p>
            <div class="wl-pic-btns">
              <label class="sb-mbtn" for="wlPicFile">Adicionar imagens</label>
              <input type="file" id="wlPicFile" accept="image/*" multiple hidden>
            </div>
          </div>
        </div>
        <div class="wl-dright">
          <div class="bd-f wl-full"><label class="bd-label" for="wlName">Nome</label><input class="bd-input" id="wlName" maxlength="200" autocomplete="off" placeholder="O que você quer?"></div>
          <div class="bd-f"><label class="bd-label" for="wlPrice">Preço <em>(opcional)</em></label><input class="bd-input" id="wlPrice" inputmode="decimal" autocomplete="off" placeholder="0,00"></div>
          <div class="bd-f"><label class="bd-label" for="wlCur">Moeda</label><select class="bd-input" id="wlCur"><option>BRL</option><option>USD</option><option>EUR</option><option>GBP</option></select></div>
          <div class="bd-f"><label class="bd-label" for="wlCat">Categoria</label><select class="bd-input" id="wlCat"></select></div>
          <div class="bd-f"><label class="bd-label" for="wlLong">O quanto você quer <output class="wl-out" id="wlLongOut">5</output></label><input class="wl-range" id="wlLong" type="range" min="0" max="10" value="5"></div>
          <div class="bd-f wl-full"><label class="bd-label" for="wlUrl">Link <em>(opcional)</em></label><input class="bd-input" id="wlUrl" maxlength="1000" autocomplete="off" inputmode="url" placeholder="https://…"></div>
          <div class="bd-f wl-full wl-notes">
            <label class="bd-label" for="wlNoteAdd">Notas <em>(opcional)</em></label>
            <ul class="wl-nlist" id="wlNList"></ul>
            <div class="wl-nadd"><input class="bd-input" id="wlNoteAdd" maxlength="300" autocomplete="off" placeholder="Cor, tamanho, esperar promoção… e Enter para adicionar"><button type="button" class="sb-mbtn" id="wlNoteBtn">Adicionar</button></div>
          </div>
        </div>
      </div>
      <p class="bd-err" id="wlErr" role="alert" hidden></p>
      <button class="bd-save" type="submit">Salvar</button>
      <button class="bd-del" type="button" id="wlDelete" hidden>Apagar este item</button>
    </form>
  </dialog>

  <dialog class="bd-modal" id="wlGotDialog" aria-labelledby="wlGotTitle">
    <form method="dialog" id="wlGotForm" novalidate>
      <header><h2 id="wlGotTitle">Consegui</h2><button type="button" class="bd-x" id="wlGotClose" aria-label="Fechar"></button></header>
      <p class="wl-gotname" id="wlGotName"></p>
      <div class="sb-card">
        <div class="bd-row2">
          <div class="bd-f"><label class="bd-label" for="wlGotDate">Dia em que conseguiu</label><input class="bd-input" id="wlGotDate" type="date"></div>
          <div class="bd-f"><label class="bd-label" for="wlGotPaid">O que você pagou</label><input class="bd-input" id="wlGotPaid" inputmode="decimal" autocomplete="off" placeholder="0,00"></div>
        </div>
        <div class="bd-f"><label class="bd-label" for="wlGotWith">Pago com <em>(opcional)</em></label><input class="bd-input" id="wlGotWith" maxlength="60" autocomplete="off" placeholder="Nubank, dinheiro, presente…"></div>
        <div class="bd-f"><span class="bd-label">Como está sendo até agora?</span>
          <div class="wl-verdict" role="group" aria-label="Avaliação">
            <button type="button" data-v="happy" aria-pressed="false">Satisfeito</button>
            <button type="button" data-v="" aria-pressed="true">Ainda não sei</button>
            <button type="button" data-v="regret" aria-pressed="false">Arrependido</button>
          </div>
        </div>
      </div>
      <p class="bd-err" id="wlGotErr" role="alert" hidden></p>
      <button class="bd-save" type="submit">Mover para Conquistados</button>
    </form>
  </dialog>

  <dialog class="ck-modal wl-view" id="wlView" aria-label="Item da lista de desejos">
    <button type="button" class="ck-x" id="wlViewClose" aria-label="Fechar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div id="wlViewBody"></div>
  </dialog>

  <script src="toast.js?v=2"></script>
  <script src="checkin.js?v=9"></script>
  <script src="datepick.js?v=1"></script>
  <script src="confirm.js?v=1"></script>
  <script src="wishlist.js?v=12"></script>
  <script src="flame.js?v=1"></script>
  <script src="dialogs.js?v=1"></script>
  <script src="nav-menu.js?v=1"></script>
  <script src="sparkle.js?v=4"></script>
</body>
</html>
