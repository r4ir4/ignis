<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4e4d0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="home.css?v=113">
  <link rel="stylesheet" href="flame.css?v=3">
  <link rel="stylesheet" href="health.css?v=39">
  <link rel="stylesheet" href="food.css?v=48">
  <link rel="stylesheet" href="goals.css?v=6">
  <link rel="stylesheet" href="goals-page.css?v=3">
  <link rel="stylesheet" href="toast.css?v=1">
  <title>Goals · Ignis</title>
  <link rel="stylesheet" href="home-minimal.css?v=2">
  <link rel="stylesheet" href="nav-menu.css?v=2">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=DM+Mono:wght@400;500&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sand-trial.css">
  <link rel="stylesheet" href="mobile.css?v=1">
</head>
<body class="home health food goals">
  <script src="shell.js?v=2"></script>


  <main id="main" class="page h-page">
    <p class="h-empty" id="gEmpty" hidden></p>
    <div id="gGrid"></div>
  </main>

  <dialog class="gl-modal gl-wide" id="gDialog" aria-labelledby="gDlgTitle">
    <form method="dialog" id="gForm" novalidate>
      <header>
        <span class="gl-hico" aria-hidden="true"><svg viewBox="0 0 84 84"><g class="gl-i-target"><circle cx="42" cy="42" r="32" fill="currentColor"/><circle cx="42" cy="42" r="21" fill="#fff" opacity=".9"/><circle cx="42" cy="42" r="10" fill="currentColor"/></g></svg></span>
        <h2 id="gDlgTitle">Nova meta</h2>
        <button type="button" class="gl-x" id="gClose" aria-label="Fechar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </header>
      <div class="gl-dcard">
        <div class="gl-f"><label class="gl-label" for="gTitle">Meta</label>
        <input class="gl-input" id="gTitle" maxlength="120" autocomplete="off" placeholder="Correr 10 km, ler 20 livros, aprender a nadar…"></div>
        <div class="gl-f"><span class="gl-label">Área</span>
        <div class="gl-seg gl-seg5 gl-cats" id="gCat" role="group" aria-label="Área"><button type="button" data-v="body">Corpo</button><button type="button" data-v="mind">Mente</button><button type="button" data-v="skills">Habilidades</button><button type="button" data-v="life">Vida</button><button type="button" data-v="money">Dinheiro</button></div></div>
        <div class="gl-f"><span class="gl-label">Como acompanhar</span>
        <div class="gl-seg gl-seg3 gl-kinds" id="gKind" role="group" aria-label="Acompanhamento">
          <button type="button" data-v="number"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 7 20M17 4l-2 16M4 9h17M3 15h17"/></svg>Um número</button>
          <button type="button" data-v="steps"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>Etapas</button>
          <button type="button" data-v="simple"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Só concluir</button>
        </div></div>
        <div class="gl-num" id="gNumWrap">
          <div class="gl-f"><label class="gl-label" for="gCur">Até agora</label><input class="gl-input gl-big" id="gCur" type="number" inputmode="decimal" step="any" min="0" placeholder="0"></div>
          <div class="gl-f"><label class="gl-label" for="gTarget">Alvo</label><input class="gl-input gl-big" id="gTarget" type="number" inputmode="decimal" step="any" min="0" placeholder="0"></div>
          <div class="gl-f"><label class="gl-label" for="gUnit">Unidade <em>(opcional)</em></label><input class="gl-input gl-big gl-unit" id="gUnit" maxlength="20" autocomplete="off" placeholder="livros, km…"></div>
        </div>
        <div class="gl-f" id="gStepsWrap" hidden>
          <span class="gl-label">Etapas</span>
          <div class="gl-steps" id="gSteps"></div>
          <div class="gl-addstep"><input class="gl-input" id="gStepNew" maxlength="120" autocomplete="off" placeholder="Adicionar uma etapa…"><button type="button" class="gl-chip" id="gStepAdd">+ Adicionar</button></div>
        </div>
      </div>
      <div class="gl-dcard gl-dcard2">
        <div class="gl-f"><label class="gl-label" for="gDue">Prazo <em>(opcional)</em></label>
        <input type="hidden" id="gDue">
        <button type="button" class="gl-whenbtn" id="gWhenBtn" aria-expanded="false" aria-controls="gCal"><span id="gWhenText">Sem prazo</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="gl-quick" id="gQuick" role="group" aria-label="Prazos rápidos"><button type="button" data-d="7">1 semana</button><button type="button" data-d="30">1 mês</button><button type="button" data-d="90">3 meses</button><button type="button" data-d="eoy">Fim do ano</button><button type="button" data-d="0">Sem data</button></div></div>
        <div class="gl-cal" id="gCal" hidden>
          <header><button type="button" class="gl-calnav" id="gCalPrev" aria-label="Mês anterior">&#8249;</button><h3 id="gCalTitle"></h3><button type="button" class="gl-calnav" id="gCalNext" aria-label="Próximo mês">&#8250;</button></header>
          <div class="gl-dow" aria-hidden="true"><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span><span>D</span></div>
          <div class="gl-days" id="gCalGrid"></div>
        </div>
        <div class="gl-f"><label class="gl-label" for="gNote">Por que importa <em>(opcional)</em></label>
        <input class="gl-input" id="gNote" maxlength="1000" autocomplete="off" placeholder="Uma frase para lembrar você…"></div>
      </div>
      <p class="gl-err" id="gErr" role="alert" hidden></p>
      <button class="gl-save" type="submit" id="gSave"><span>Salvar meta</span></button>
      <button class="gl-done" type="button" id="gDone" hidden>Marcar como concluída</button>
      <button class="gl-del" type="button" id="gDelete" hidden>Apagar esta meta</button>
    </form>
  </dialog>

  
  <script src="toast.js?v=2"></script>
  <script src="confirm.js?v=1"></script>
  <script src="goals.js?v=9"></script>
  <script src="flame.js?v=1"></script>
  <script src="dialogs.js?v=1"></script>
  <script src="nav-menu.js?v=1"></script>
  <script src="sparkle.js?v=4"></script>
</body>
</html>
