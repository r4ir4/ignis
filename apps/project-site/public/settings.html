<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4e4d0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="home.css?v=113">
  <link rel="stylesheet" href="flame.css?v=3">
  <link rel="stylesheet" href="health.css?v=39">
  <link rel="stylesheet" href="settings.css?v=1">
  <title>Settings · Ignis</title>
  <link rel="stylesheet" href="home-minimal.css?v=2">
  <link rel="stylesheet" href="nav-menu.css?v=2">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=DM+Mono:wght@400;500&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sand-trial.css">
  <link rel="stylesheet" href="mobile.css?v=1">
</head>
<body class="home health settings">
  <script src="shell.js?v=2"></script>


  <main id="main" class="page h-page">
    <p class="h-empty" id="stEmpty" hidden></p>
    <div id="stGrid"></div>
  </main>

  <dialog class="st-modal" id="stTokDialog" aria-labelledby="stTokTitle">
    <form method="dialog" id="stTokForm" novalidate>
      <header><h2 id="stTokTitle">New token</h2><button type="button" class="st-x" id="stTokClose" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
      <div class="st-dcard" id="stTokAsk">
        <label class="st-label" for="stTokName">Device name</label>
        <input class="st-input" id="stTokName" maxlength="32" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="iphone, ipad, laptop…">
        <p class="st-hint">Lowercase letters, digits and dashes. Making a token with a name that already exists replaces the old one.</p>
      </div>
      <div class="st-dcard" id="stTokShow" hidden>
        <span class="st-label">Your token</span>
        <code class="st-token" id="stTokVal"></code>
        <p class="st-hint">Copy it now. It is shown only once; the server keeps just a fingerprint. Send it as <b>Authorization: Bearer &lt;token&gt;</b> to <b>api.ignis.farm</b>.</p>
        <button type="button" class="st-copy" id="stTokCopy">Copy token</button>
      </div>
      <p class="st-err" id="stTokErr" role="alert" hidden></p>
      <button class="st-save" type="submit" id="stTokSave"><span>Generate token</span></button>
    </form>
  </dialog>

  <div class="h-toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="settings.js?v=1"></script>
  <script src="flame.js?v=1"></script>
  <script src="dialogs.js?v=1"></script>
  <script src="nav-menu.js?v=1"></script>
  <script src="sparkle.js?v=4"></script>
</body>
</html>
